input {
  file {
    path => "/usr/share/logstash/uploads/*.json"
    codec => "json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_json"
     discover_interval => 1
    stat_interval => "500 ms"
  }
}

filter {
 
  mutate {
    remove_field => ["@version", "event", "host", "log", "path"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "security-logs"
  }
}