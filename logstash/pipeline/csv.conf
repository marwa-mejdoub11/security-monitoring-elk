input {
  file {
    path => "/usr/share/logstash/uploads/*.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"
       discover_interval => 1
    stat_interval => "500 ms"
  }
}

filter {
    mutate {
    add_field => { "source_file" => "%{[log][file][path]}" }
  }
  mutate {
    gsub => ["source_file", "^.*/", ""]
  }
  mutate {
    gsub => ["message", "[\r\n]+$", ""]
  }
  if [message] =~ /^@timestamp,/ {
    drop {}
  }
  csv {
    separator => ","
    columns => ["timestamp","event_id","event_type","username","source_ip","status","severity","country","message","attack_type"]
  }
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    remove_field => ["timestamp", "@version", "event", "host", "log", "path"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "security-logs"
  }
}