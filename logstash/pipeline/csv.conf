input {
  file {
    path => "/usr/share/logstash/uploads/*.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"
  }
}

filter {
  csv {
    separator => ","
    skip_header => true
    columns => ["@timestamp","event_id","event_type","username","source_ip","status","severity","country","message","attack_type"]
  }
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    remove_field => ["@version", "event", "host", "log", "path", "message_original"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "security-logs"
  }
}